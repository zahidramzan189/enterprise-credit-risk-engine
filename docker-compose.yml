services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - ./data:/app/data
      - ./models:/app/models
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports: ["8080:80"]
    depends_on: [backend]
